# Laptop: RTX 5060 Laptop GPU, 8 GB VRAM. One model fits on the GPU at a time.
profile: laptop

ollama:
  host: http://127.0.0.1:11434
  timeout_s: 600
  keep_alive: 10m

models:
  fast: qwen3.5:4b
  reasoning: qwen3.5:9b
  deep: qwen3.5:9b           # no bigger model fits; gpt-oss:20b works with CPU offload if you have 32 GB RAM
  embed: qwen3-embedding:0.6b

model_options:
  fast:      {num_ctx: 8192, think: false, temperature: 0.7}
  reasoning: {num_ctx: 8192, think: false, temperature: 0.6}
  deep:      {num_ctx: 8192, think: true,  temperature: 0.6}

router:
  llm_classify: false
  long_prompt_chars: 700

memory:
  enabled: true
  extract: true
  top_k: 5
  min_similarity: 0.35
  history_turns: 8

research:
  subqueries: 4
  results_per_query: 4
  max_sources: 6
  max_chars_per_source: 4000
  parallel: 1
  think: false
  num_ctx: 8192
  formats: [md]

deep:
  unload_fast: false

paths:
  db: data/atlas.db
  workspace: data/workspace
  reports: data/reports
  profile: configs/profile.yaml

voice:
  enabled: false

agent:
  max_tool_steps: 5
