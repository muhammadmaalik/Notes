[project]
name = "atlas"
version = "0.3.0"
description = "Atlas: a local, multi-model personal assistant (router + tools + memory) on Ollama"
readme = "SETUP.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "textual>=8.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
